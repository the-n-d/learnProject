<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Учёт расходов</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="js/main.js"></script>
</head>

<body>
	<main class="app">
		<h1>Учёт расходов</h1>

		<form id="expense-form" class="form" novalidate>
			<div class="field">
				<label for="name">Название</label>
				<input type="text" id="name" name="name" placeholder="Например, продукты" autocomplete="off">
			</div>

			<div class="field">
				<label for="amount">Сумма (₽)</label>
				<input type="text" id="amount" name="amount" placeholder="0.00" inputmode="decimal" autocomplete="off">
			</div>

			<div class="field">
				<label for="category">Категория</label>
				<select id="category" name="category">
					<option value="food">Еда</option>
					<option value="transport">Транспорт</option>
					<option value="fun">Развлечения</option>
					<option value="other">Другое</option>
				</select>
			</div>

			<button type="submit">Добавить</button>
			<p id="form-error" class="error" role="alert" aria-live="polite"></p>
		</form>

		<section class="controls">
			<div class="field">
				<label for="filter">Фильтр по категории</label>
				<select id="filter">
					<option value="all">Все</option>
					<option value="food">Еда</option>
					<option value="transport">Транспорт</option>
					<option value="fun">Развлечения</option>
					<option value="other">Другое</option>
				</select>
			</div>

			<div class="field">
				<label for="sort">Сортировка по сумме</label>
				<select id="sort">
					<option value="none">Без сортировки</option>
					<option value="asc">По возрастанию</option>
					<option value="desc">По убыванию</option>
				</select>
			</div>
		</section>

		<section class="summary">
			<span>Всего записей: <strong id="count">0</strong></span>
			<span>Сумма: <strong id="total">0.00</strong> ₽</span>
		</section>

		<ul id="expense-list" class="list"></ul>
		<p id="empty-message" class="empty" hidden>Записей нет. Добавьте первый расход.</p>
	</main>

</body>

</html>
