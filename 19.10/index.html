<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Каталог товаров</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="main.js" defer></script>
</head>

<body class="bg-light">
	<div class="container py-4">
		<h1 class="mb-3">Каталог товаров</h1>

		<div class="row g-2 mb-3">
			<div class="col-md-8">
				<input id="searchInput" type="text" class="form-control" placeholder="Поиск по названию...">
			</div>
			<div class="col-md-2">
				<button id="searchBtn" class="btn btn-primary w-100">Найти</button>
			</div>
			<div class="col-md-2">
				<button id="reloadBtn" class="btn btn-outline-secondary w-100">Сброс</button>
			</div>
		</div>

		<div id="status" class="mb-3"></div>

		<div id="products" class="row g-3"></div>
	</div>
</body>

</html>
